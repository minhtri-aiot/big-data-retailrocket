name: retailrocket-graph-demo
services:
  api:
    build: .
    image: retailrocket-graph:unified
    command: [python, -m, uvicorn, service.app:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      OUTPUT_ROOT: /app/outputs
    volumes:
      - ./outputs:/app/outputs:ro
    ports: ["127.0.0.1:${APP_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 10
